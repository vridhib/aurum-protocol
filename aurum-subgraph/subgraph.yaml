specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AurumEngine
    network: sepolia
    source:
      address: "0xfc243b4040002d4a9fc3ec412af04eaa2f0da525"
      abi: AurumEngine
      startBlock: 10928150
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - UserCollateral
        - UserDebtAllocation
        - Protocol
        - Liquidation
        - ForceClose
        - CumulativeIndexUpdate
        - LTVUpdate
        - CollateralInfoUpdate
        - TreasuryFee
        - DebtCeilingHitUpdate
        - CollateralSeizedUpdate
      abis:
        - name: AurumEngine
          file: ./abis/AurumEngine.json
      eventHandlers:
        - event: CollateralDeposited(indexed address,indexed address,indexed uint256)
          handler: handleCollateralDeposited
        - event: CollateralRedeemed(indexed address,indexed address,indexed address,uint256)
          handler: handleCollateralRedeemed
        - event: MintAUSD(indexed address,uint256)          
          handler: handleMintAUSD
        - event: BurnAUSD(indexed address,uint256)          
          handler: handleBurnAUSD
        - event: Liquidated(indexed address,indexed address,uint256,indexed address,uint256,uint256)
          handler: handleLiquidated
        - event: ForceClosed(indexed address,uint256,uint256)
          handler: handleForceClosed
        - event: DebtAllocated(address,address,uint256)
          handler: handleDebtAllocated
        - event: DebtDeallocated(address,address,uint256)
          handler: handleDebtDeallocated
        - event: CumulativeIndexUpdated(uint256,uint256)
          handler: handleCumulativeIndexUpdated
        - event: LTVUpdated(address,uint256)
          handler: handleLtvUpdated
        - event: CollateralInfoUpdated(address,address,address,uint256,uint256,bool)
          handler: handleCollateralInfoUpdated
        - event: TreasuryFeeSent(address,address,uint256)
          handler: handleTreasuryFeeSent
        - event: DebtCeilingHit(indexed address,uint256,uint256)
          handler: handleDebtCeilingHit
        - event: CollateralSeized(indexed address,uint256)
          handler: handleCollateralSeized
      file: ./src/aurum-engine.ts